name: Validate PocketChat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web UI
        env:
          VITE_API_URL: https://personal-messenger-api.onrender.com
        run: npm run build:ui
      - name: Check backend and Electron syntax
        run: |
          node --check server/index.js
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Check floating pet script syntax
        run: node -e "const fs=require('fs'); const html=fs.readFileSync('electron/pet.html','utf8'); const match=html.match(/<script>([\\s\\S]*?)<\\/script>/i); if(!match) throw new Error('Pet script missing'); new Function(match[1]); console.log('Pet script syntax OK');"
